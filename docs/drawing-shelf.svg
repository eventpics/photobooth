<text x="60.0" y="44.0" font-size="16" text-anchor="start" fill="#1F2937" font-weight="600">EventPics Fotobox: Ablage für den Drucker</text>
<text x="60.0" y="66.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Die Ablage klemmt auf dem Rohr des Ständers. Zwei Leisten bilden eine Gabel, hinten schließt ein Klotz, vorn hält eine Schraube M8 × 90 mit Flügelmutter.</text>
<text x="80.0" y="116.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="600">Ablage von oben</text>
