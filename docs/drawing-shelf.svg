<text x="750.0" y="390.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Das Rohr des Ständers misst 35 mm, die Gabel 37 mm.</text>
<text x="750.0" y="405.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Die Schraube liegt vor dem Rohr: anziehen, und die</text>
<text x="750.0" y="420.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Ablage sitzt in jeder Höhe fest.</text>
<text x="750.0" y="435.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal"></text>
<text x="750.0" y="450.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Der Drucker steht lose darauf. Für den Transport</text>
<text x="750.0" y="465.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">nimmt man ihn herunter, die Ablage bleibt.</text>
