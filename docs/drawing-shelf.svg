<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="DejaVu Sans, Verdana, sans-serif">
<rect width="1120" height="780" fill="#FFFFFF"/>
<text x="60.0" y="44.0" font-size="16" text-anchor="start" fill="#1F2937" font-weight="600">EventPics Fotobox: Ablage für den Drucker</text>
<text x="60.0" y="66.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Die Ablage hängt an der hinteren Kante am Rohr des Ständers. Zwei Leisten stehen über die Kante hinaus und bilden eine Gabel, ein Klotz schließt sie zum Brett hin.</text>
<text x="80.0" y="134.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="600">Von oben</text>
<rect x="80.0" y="150.0" width="400.0" height="210.0" rx="0" fill="#FBF7EE" stroke="#1F2937" stroke-width="2"/>
<rect x="110.0" y="170.0" width="210.0" height="170.0" rx="0" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="215.0" y="260.0" font-size="11" text-anchor="middle" fill="#6B7280" font-weight="normal">printer</text>
<circle cx="280.0" cy="360.0" r="18.5" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.4"/>
<text x="280.0" y="398.0" font-size="10" text-anchor="middle" fill="#1F2937" font-weight="normal">Rohr Ø 37, hinter der Kante</text>
<line x1="80.0" y1="422.0" x2="480.0" y2="422.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="80.0" y1="418.0" x2="80.0" y2="426.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="480.0" y1="418.0" x2="480.0" y2="426.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="280.0" y="417.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="normal">400</text>
<line x1="54.0" y1="150.0" x2="54.0" y2="360.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="50.0" y1="150.0" x2="58.0" y2="150.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="50.0" y1="360.0" x2="58.0" y2="360.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="48.0" y="255.0" font-size="11" text-anchor="middle" fill="#4B5563" transform="rotate(-90 48.0 255.0)">210</text>
<text x="580.0" y="134.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="600">Von unten</text>
<rect x="580.0" y="150.0" width="400.0" height="210.0" rx="0" fill="#FBF7EE" stroke="#1F2937" stroke-width="2"/>
<rect x="741.0" y="230.0" width="20.0" height="210.0" rx="0" fill="#E9D8A6" stroke="#1F2937" stroke-width="1.4"/>
<rect x="799.0" y="230.0" width="20.0" height="210.0" rx="0" fill="#E9D8A6" stroke="#1F2937" stroke-width="1.4"/>
<rect x="761.0" y="230.0" width="38.0" height="60.0" rx="0" fill="#D6BE7A" stroke="#1F2937" stroke-width="1.4"/>
<circle cx="780.0" cy="362.0" r="18.5" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.2"/>
<circle cx="780.0" cy="412.0" r="4.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/>
<line x1="730.0" y1="412.0" x2="830.0" y2="412.0" stroke="#1F2937" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="836.0" y="416.0" font-size="10" text-anchor="start" fill="#1F2937" font-weight="normal">Bohrung Ø 9 für M8 × 90</text>
<text x="780.0" y="266.0" font-size="9" text-anchor="middle" fill="#1F2937" font-weight="normal">block</text>
<text x="838.0" y="366.0" font-size="10" text-anchor="start" fill="#1F2937" font-weight="normal">Rohr</text>
<line x1="761.0" y1="320.0" x2="799.0" y2="320.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="761.0" y1="316.0" x2="761.0" y2="324.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="799.0" y1="316.0" x2="799.0" y2="324.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="780.0" y="315.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="normal">37</text>
<line x1="720.0" y1="360.0" x2="720.0" y2="440.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="716.0" y1="360.0" x2="724.0" y2="360.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="716.0" y1="440.0" x2="724.0" y2="440.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="714.0" y="400.0" font-size="11" text-anchor="middle" fill="#4B5563" transform="rotate(-90 714.0 400.0)">80</text>
<line x1="580.0" y1="360.0" x2="980.0" y2="360.0" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<text x="588.0" y="354.0" font-size="10" text-anchor="start" fill="#1F2937" font-weight="normal">hintere Kante des Bretts</text>
<line x1="910.0" y1="230.0" x2="910.0" y2="440.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="906.0" y1="230.0" x2="914.0" y2="230.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="906.0" y1="440.0" x2="914.0" y2="440.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="904.0" y="335.0" font-size="11" text-anchor="middle" fill="#4B5563" transform="rotate(-90 904.0 335.0)">210</text>
<line x1="580.0" y1="480.0" x2="980.0" y2="480.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="580.0" y1="476.0" x2="580.0" y2="484.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="980.0" y1="476.0" x2="980.0" y2="484.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="780.0" y="475.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="normal">400</text>
<text x="80.0" y="534.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="600">Schnitt durch die Gabel, von hinten gesehen</text>
<rect x="80.0" y="560.0" width="440.0" height="15.0" rx="0" fill="#FBF7EE" stroke="#1F2937" stroke-width="2"/>
<text x="530.0" y="571.0" font-size="10" text-anchor="start" fill="#1F2937" font-weight="normal">shelf 15 mm</text>
<rect x="260.0" y="575.0" width="20.0" height="40.0" rx="0" fill="#E9D8A6" stroke="#1F2937" stroke-width="1.4"/>
<rect x="317.0" y="575.0" width="20.0" height="40.0" rx="0" fill="#E9D8A6" stroke="#1F2937" stroke-width="1.4"/>
<circle cx="298.5" cy="596.0" r="18.5" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.2"/>
<line x1="280.0" y1="636.0" x2="317.0" y2="636.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="280.0" y1="632.0" x2="280.0" y2="640.0" stroke="#9CA3AF" stroke-width="1"/>
<line x1="317.0" y1="632.0" x2="317.0" y2="640.0" stroke="#9CA3AF" stroke-width="1"/>
<text x="298.5" y="631.0" font-size="11" text-anchor="middle" fill="#4B5563" font-weight="normal">37</text>
<text x="360.0" y="600.0" font-size="10" text-anchor="start" fill="#1F2937" font-weight="normal">Leisten 20 × 40</text>
<text x="600.0" y="520.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Das Rohr misst auf dieser Höhe etwa 37 mm, genau</text>
<text x="600.0" y="535.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">wie die Gabel: Die Ablage klemmt von selbst, aufschieben</text>
<text x="600.0" y="550.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">genügt. Eine Schraube M8 × 90 mit Flügelmutter quer</text>
<text x="600.0" y="565.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">durch beide Leisten sichert sie zusätzlich.</text>
<text x="600.0" y="580.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal"></text>
<text x="600.0" y="595.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">Der Drucker steht lose darauf. Für den Transport nimmt</text>
<text x="600.0" y="610.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">man ihn herunter, die Ablage bleibt am Rohr.</text>
</svg>
