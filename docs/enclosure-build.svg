<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1050" width="420mm" height="210mm" font-family="DejaVu Sans, Verdana, Helvetica, sans-serif">
<rect width="2100" height="1050" fill="#F5F3EE"/>
<text x="1050.0" y="58.0" font-size="32" fill="#241F18" text-anchor="middle" font-weight="700">EventPics Fotobox – Gehäuse aus Eiche</text>
<text x="1050.0" y="90.0" font-size="17" fill="#6B6255" text-anchor="middle" font-weight="400">400 × 330 × 120 mm · 18 mm Eiche · rot = Durchbruch · grün gestrichelt = Tasche, nur gefräst</text>
<g transform="translate(170 220)"><text x="200.0" y="-48.0" font-size="22" fill="#241F18" text-anchor="middle" font-weight="700">Vorderseite</text><text x="200.0" y="-28.0" font-size="14" fill="#6B6255" text-anchor="middle" font-weight="400">18 mm Eiche · Taschen von hinten gefräst</text><rect x="0" y="0" width="400" height="330" rx="35" ry="35" fill="#E3CEA6" stroke="#241F18" stroke-width="2.5"/><rect x="30.0" y="70" width="340" height="230" rx="4" fill="#FFFFFF" stroke="#2F6F4E" stroke-width="1.8" stroke-dasharray="9 5"/><rect x="35.0" y="75" width="330" height="205" rx="3" fill="#2B2A28" stroke="#B3382F" stroke-width="2"/><text x="200.0" y="173.5" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Durchbruch 330 × 205</text><text x="200.0" y="195.5" font-size="13" fill="#BDB6AA" text-anchor="middle" font-weight="400">Tasche 340 × 230 dahinter</text><text x="21.0" y="115.0" font-size="12" fill="#2F6F4E" text-anchor="middle" font-weight="400">5</text><text x="200.0" y="86.0" font-size="12" fill="#2F6F4E" text-anchor="middle" font-weight="400">5</text><text x="200.0" y="293.0" font-size="12" fill="#2F6F4E" text-anchor="middle" font-weight="400">20</text><rect x="185.0" y="25" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#2F6F4E" stroke-width="1.8" stroke-dasharray="7 4"/><circle cx="200.0" cy="40.0" r="6.0" fill="none" stroke="#B3382F" stroke-width="1.8"/><text x="254.0" y="39.0" font-size="12" fill="#2F6F4E" text-anchor="start" font-weight="400">Tasche 30 × 30</text><text x="254.0" y="55.0" font-size="12" fill="#B3382F" text-anchor="start" font-weight="400">Bohrung Ø 12</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M0.0 370V382M400.0 370V382M0.0 376H400.0"/></g><text x="200.0" y="368.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">400</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M-44 0.0H-32M-44 330.0H-32M-38 0.0V330.0"/></g><text x="-46.0" y="165.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 -46.0 165.0)">330</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M30.0 314V326M370.0 314V326M30.0 320H370.0"/></g><text x="200.0" y="312.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">340</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M426 70.0H438M426 300.0H438M432 70.0V300.0"/></g><text x="424.0" y="185.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 424.0 185.0)">230</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M-20 0.0H-8M-20 70.0H-8M-14 0.0V70.0"/></g><text x="-22.0" y="35.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 -22.0 35.0)">70</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M-20 300.0H-8M-20 330.0H-8M-14 300.0V330.0"/></g><text x="-22.0" y="315.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 -22.0 315.0)">30</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M0.0 342V354M30.0 342V354M0.0 348H30.0"/></g><text x="15.0" y="340.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">30</text><path d="M0 35A35 35 0 0 1 35 0" stroke="#C97A16" stroke-width="2.4" fill="none" stroke-dasharray="5 4"/><text x="53.0" y="16.0" font-size="13" fill="#C97A16" text-anchor="start" font-weight="400">R 35</text></g>
<g transform="translate(740 220)"><text x="200.0" y="-48.0" font-size="22" fill="#241F18" text-anchor="middle" font-weight="700">Rückseite</text><text x="200.0" y="-28.0" font-size="14" fill="#6B6255" text-anchor="middle" font-weight="400">Tür über die ganze Fläche, aufgeschraubte Scharniere</text><rect x="0" y="0" width="400" height="330" rx="35" ry="35" fill="#E3CEA6" stroke="#241F18" stroke-width="2.5"/><rect x="22" y="60" width="30" height="40" rx="3" fill="none" stroke="#B3382F" stroke-width="1.8"/><path d="M22 80h30" stroke="#C9C1B2" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="22" y="230" width="30" height="40" rx="3" fill="none" stroke="#B3382F" stroke-width="1.8"/><path d="M22 250h30" stroke="#C9C1B2" stroke-width="0.8" stroke-dasharray="4 3"/><text x="37.0" y="46.0" font-size="12" fill="#B3382F" text-anchor="middle" font-weight="400">Aufschraub-</text><text x="37.0" y="60.0" font-size="12" fill="#B3382F" text-anchor="middle" font-weight="400">scharnier</text><circle cx="368" cy="165.0" r="9.5" fill="none" stroke="#B3382F" stroke-width="1.8"/><rect x="354" y="145.0" width="28" height="40" rx="3" fill="none" stroke="#C9C1B2" stroke-width="1" stroke-dasharray="4 3"/><text x="344.0" y="169.0" font-size="12" fill="#B3382F" text-anchor="end" font-weight="400">Schloss Ø 19</text><text x="344.0" y="185.0" font-size="12" fill="#6B6255" text-anchor="end" font-weight="400">Schließmaß 22</text><path d="M185.0 0v10a7 7 0 0 0 7 7h16a7 7 0 0 0 7 -7V0" fill="none" stroke="#B3382F" stroke-width="1.8"/><text x="256.0" y="20.0" font-size="12" fill="#B3382F" text-anchor="start" font-weight="400">Kabel zur Leuchte</text><path d="M185.0 330v-10a7 7 0 0 1 7 -7h16a7 7 0 0 1 7 7v10" fill="none" stroke="#B3382F" stroke-width="1.8"/><text x="256.0" y="318.0" font-size="12" fill="#B3382F" text-anchor="start" font-weight="400">Kabel zum Drucker</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M0.0 370V382M400.0 370V382M0.0 376H400.0"/></g><text x="200.0" y="368.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">400</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M-44 0.0H-32M-44 330.0H-32M-38 0.0V330.0"/></g><text x="-46.0" y="165.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 -46.0 165.0)">330</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M74 0.0H86M74 85.0H86M80 0.0V85.0"/></g><text x="72.0" y="42.5" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 72.0 42.5)">85</text></g>
<g transform="translate(1310 220)"><text x="60.0" y="-48.0" font-size="22" fill="#241F18" text-anchor="middle" font-weight="700">Schnitt</text><text x="60.0" y="-28.0" font-size="14" fill="#6B6255" text-anchor="middle" font-weight="400">von rechts</text><rect x="0" y="0" width="120" height="330" rx="16" fill="#FFFFFF" stroke="#241F18" stroke-width="2.5"/><path d="M0 0h18v70h-7v230h7v30H0Z" fill="#E3CEA6" stroke="#241F18" stroke-width="1.2"/><text x="4.0" y="346.0" font-size="11" fill="#6B6255" text-anchor="middle" font-weight="400">15</text><text x="26.0" y="62.0" font-size="11" fill="#2F6F4E" text-anchor="start" font-weight="400">Tasche 9 tief</text><rect x="102" y="0" width="18" height="330" fill="#E3CEA6" stroke="#241F18" stroke-width="1.2"/><text x="114.0" y="346.0" font-size="11" fill="#6B6255" text-anchor="middle" font-weight="400">15</text><rect x="11" y="70" width="14" height="230" fill="#2B2A28"/><text x="42.0" y="185.0" font-size="12" fill="#241F18" text-anchor="middle" font-weight="400" transform="rotate(-90 42.0 185.0)">Bildschirm</text><rect x="28" y="140" width="26" height="56" fill="none" stroke="#241F18" stroke-width="1.4"/><text x="41.0" y="172.0" font-size="12" fill="#241F18" text-anchor="middle" font-weight="600">Pi</text><text x="62.0" y="156.0" font-size="11" fill="#6B6255" text-anchor="start" font-weight="400">am Gewinde</text><text x="62.0" y="170.0" font-size="11" fill="#6B6255" text-anchor="start" font-weight="400">des Bildschirms,</text><text x="62.0" y="184.0" font-size="11" fill="#C97A16" text-anchor="start" font-weight="400">Halter 3D-Druck</text><rect x="26" y="260" width="68" height="46" rx="4" fill="none" stroke="#B3382F" stroke-width="1.6"/><text x="60.0" y="288.0" font-size="12" fill="#B3382F" text-anchor="middle" font-weight="600">Verteiler</text><rect x="11" y="29" width="18" height="22" fill="#241F18"/><text x="48.0" y="43.0" font-size="11" fill="#6B6255" text-anchor="start" font-weight="400">Kamera in der Tasche</text><path d="M51.0 -2h18" stroke="#C97A16" stroke-width="5"/><text x="76.0" y="-8.0" font-size="12" fill="#C97A16" text-anchor="start" font-weight="400">3/8 Zoll</text><path d="M51.0 332h18" stroke="#C97A16" stroke-width="5"/><text x="76.0" y="342.0" font-size="12" fill="#C97A16" text-anchor="start" font-weight="400">3/8 Zoll</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M0.0 370V382M120.0 370V382M0.0 376H120.0"/></g><text x="60.0" y="368.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">120</text><g stroke="#6B6255" stroke-width="1" fill="none"><path d="M-38 0.0H-26M-38 330.0H-26M-32 0.0V330.0"/></g><text x="-40.0" y="165.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 -40.0 165.0)">345</text></g>
<text x="1530.0" y="215.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Die beiden Taschen</text>
<text x="1530.0" y="243.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Bildschirm: 340 × 230, 9 mm tief, von hinten</text>
<text x="1530.0" y="265.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">gefräst. Das Modul ist 9 mm dick und liegt</text>
<text x="1530.0" y="287.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">damit bündig mit der Innenseite; vorn bleiben</text>
<text x="1530.0" y="309.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">9 mm Eiche als Blende. Der Durchbruch</text>
<text x="1530.0" y="331.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">330 × 205 sitzt darin mit 5 mm oben und</text>
<text x="1530.0" y="353.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">seitlich, 20 mm unten.</text>
<text x="1530.0" y="375.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="1530.0" y="397.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Die Kante des Durchbruchs vorn mit 3 mm</text>
<text x="1530.0" y="419.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">unter 45° brechen – sonst schaut man von</text>
<text x="1530.0" y="441.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">der Seite in einen 9 mm tiefen Schacht.</text>
<text x="1530.0" y="463.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="1530.0" y="485.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Kamera: 30 × 30, rund 4 mm tief, damit das</text>
<text x="1530.0" y="507.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Objektiv dicht hinter der Bohrung sitzt.</text>
<text x="1530.0" y="529.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Ein kurzer mattschwarzer Tubus zwischen</text>
<text x="1530.0" y="551.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Objektiv und Bohrung hält Streulicht ab.</text>
<text x="1530.0" y="595.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Zur Tür</text>
<text x="1530.0" y="623.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Aufgeschraubte Scharniere statt Topfbänder:</text>
<text x="1530.0" y="645.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">keine 35er Fräsung nötig, an Eiche die</text>
<text x="1530.0" y="667.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">sauberere Lösung, und die Türstärke ist frei.</text>
<text x="1530.0" y="689.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Mit 18 mm hast du überall genug Fleisch für</text>
<text x="1530.0" y="711.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Schrauben, Schloss und Scharnier.</text>
<text x="1530.0" y="733.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="1530.0" y="755.0" font-size="14.5" fill="#B3382F" text-anchor="start" font-weight="400">Oben und unten je ein Ausschnitt für das</text>
<text x="1530.0" y="777.0" font-size="14.5" fill="#B3382F" text-anchor="start" font-weight="400">Kabel zur Leuchte und zum Drucker.</text>
<text x="1530.0" y="821.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Keine Lüftung</text>
<text x="1530.0" y="849.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Pi, Hub und die zwei Steckernetzteile geben</text>
<text x="1530.0" y="871.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">zusammen so wenig ab, dass die Eiche das</text>
<text x="1530.0" y="893.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">wegsteckt. Deshalb keine Schlitze.</text>
<text x="1530.0" y="937.0" font-size="19" fill="#C97A16" text-anchor="start" font-weight="700">Dazu gehört</text>
<text x="1530.0" y="965.0" font-size="14.5" fill="#C97A16" text-anchor="start" font-weight="400">Wo Verteiler, Netzteile, Hub und die beiden</text>
<text x="1530.0" y="987.0" font-size="14.5" fill="#C97A16" text-anchor="start" font-weight="400">USB-Buchsen sitzen, steht auf dem Blatt</text>
<text x="1530.0" y="1009.0" font-size="14.5" fill="#C97A16" text-anchor="start" font-weight="400">„Innenausbau“. Die Leitungen stehen im</text>
<text x="1530.0" y="1031.0" font-size="14.5" fill="#C97A16" text-anchor="start" font-weight="400">Kabelplan.</text>
<g stroke="#241F18" stroke-width="2" fill="none"><path d="M170 995h100M170 987v16M220 990v10M270 987v16"/></g>
<text x="220.0" y="979.0" font-size="15" fill="#241F18" text-anchor="middle" font-weight="400">100 mm in Wirklichkeit</text>
<text x="410.0" y="1000.0" font-size="15" fill="#6B6255" text-anchor="start" font-weight="400">Gedruckt auf A3 quer ist das 1 : 5.</text>
</svg>
