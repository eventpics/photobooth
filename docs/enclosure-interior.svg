<text x="48.0" y="4.0" font-size="11.5" fill="#6B6255" text-anchor="middle" font-weight="400">Ausschnitt oben in der Tür</text>
<path d="M356.0 624.0V612.0" fill="none" stroke="#B3382F" stroke-width="2" stroke-dasharray="8 5"/>
<path d="M356.0 600.0l-7 14h14z" fill="#B3382F"/>
<text x="356.0" y="712.0" font-size="12.5" fill="#B3382F" text-anchor="middle" font-weight="600">zum Drucker</text>
<text x="356.0" y="740.0" font-size="11" fill="#6B6255" text-anchor="middle" font-weight="400">Ausschnitt unten in der Tür</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M36.0 778.0V790.0M764.0 778.0V790.0M36.0 784.0H764.0"/></g><text x="400.0" y="776.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">364 innen</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M-32 36.0H-20M-32 624.0H-20M-26 36.0V624.0"/></g><text x="-34.0" y="330.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 -34.0 330.0)">294 innen</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M56.0 826.0V838.0M456.0 826.0V838.0M56.0 832.0H456.0"/></g><text x="256.0" y="824.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">Verteiler 200</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M-68 440.0H-56M-68 624.0H-56M-62 440.0V624.0"/></g><text x="-70.0" y="532.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 -70.0 532.0)">92</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M280.0 140.0H292.0M280.0 216.0H292.0M286.0 140.0V216.0"/></g><text x="278.0" y="178.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 278.0 178.0)">38</text>
</g>
<g transform="translate(1030 190)">
<text x="120.0" y="-56.0" font-size="21" fill="#241F18" text-anchor="middle" font-weight="700">Schnitt</text>
<text x="120.0" y="-34.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">von der Seite</text>
<rect x="0" y="0" width="240.0" height="660.0" rx="10" fill="#FFFFFF" stroke="#241F18" stroke-width="2.5"/>
<rect x="0" y="0" width="36.0" height="660.0" fill="#E3CEA6" stroke="#241F18" stroke-width="1.5"/>
<rect x="204.0" y="0" width="36.0" height="660.0" fill="#E3CEA6" stroke="#241F18" stroke-width="1.5"/>
<text x="222.0" y="300.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 222.0 300.0)">Tür</text>
<text x="18.0" y="620.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400" transform="rotate(-90 18.0 620.0)">vorn</text>
<rect x="18.0" y="140.0" width="18.0" height="460.0" fill="#D8D3C8" stroke="#2F6F4E" stroke-width="1.6"/>
<path d="M27.0 200.0H120.0" fill="none" stroke="#2F6F4E" stroke-width="1.2"/>
<text x="128.0" y="192.0" font-size="12.5" fill="#2F6F4E" text-anchor="start" font-weight="400">Bildschirm</text>
<text x="128.0" y="220.0" font-size="11.5" fill="#6B6255" text-anchor="start" font-weight="400">9 in der Tasche</text>
<rect x="36.0" y="216.0" width="58.0" height="194.0" rx="3" fill="#FFFFFF" stroke="#2F4A6B" stroke-width="2"/>
<text x="64.0" y="312.0" font-size="12" fill="#2F4A6B" text-anchor="middle" font-weight="400" transform="rotate(-90 64.0 312.0)">Pi 29</text>
<rect x="36.0" y="548.0" width="92.0" height="76.0" rx="3" fill="#FBF1EF" stroke="#B3382F" stroke-width="2"/>
<text x="82.0" y="596.0" font-size="11.5" fill="#B3382F" text-anchor="middle" font-weight="400">Verteiler 46</text>
<rect x="36.0" y="440.0" width="64.0" height="108.0" rx="3" fill="#FBF1EF" stroke="#B3382F" stroke-width="2"/>
<text x="68.0" y="496.0" font-size="11.5" fill="#B3382F" text-anchor="middle" font-weight="400" transform="rotate(-90 68.0 496.0)">Netzteil</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M0.0 714.0V726.0M36.0 714.0V726.0M0.0 720.0H36.0"/></g><text x="18.0" y="712.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">18</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M36.0 714.0V726.0M204.0 714.0V726.0M36.0 720.0H204.0"/></g><text x="120.0" y="712.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">84</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M204.0 714.0V726.0M240.0 714.0V726.0M204.0 720.0H240.0"/></g><text x="222.0" y="712.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">18</text>
<g stroke="#6B6255" stroke-width="1" fill="none"><path d="M94.0 290.0V302.0M204.0 290.0V302.0M94.0 296.0H204.0"/></g><text x="149.0" y="288.0" font-size="13" fill="#6B6255" text-anchor="middle" font-weight="400">55 frei</text>
</g>
<text x="1340.0" y="200.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Die Tiefe geht sich aus</text>
<text x="1340.0" y="228.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">120 minus zweimal 18 sind 84 mm Innentiefe.</text>
<text x="1340.0" y="250.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Der Bildschirm liegt bündig in der Tasche und</text>
<text x="1340.0" y="272.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">braucht davon nichts. Der Pi baut mit Halter</text>
<text x="1340.0" y="294.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">29 mm auf, es bleiben 55 mm bis zur Tür.</text>
<text x="1340.0" y="316.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Die Steckdosenleiste liegt flach, das sind</text>
<text x="1340.0" y="338.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">46 mm, und darüber bleiben noch 38 mm.</text>
<text x="1340.0" y="382.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Der Punkt, an dem es kippt</text>
<text x="1340.0" y="410.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Die Steckernetzteile stehen nach oben in der</text>
<text x="1340.0" y="432.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Leiste, nicht nach hinten. Steckte eines zur</text>
<text x="1340.0" y="454.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Tür hin, wären es 46 + 50 = 96 mm – und die</text>
<text x="1340.0" y="476.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Tür ginge nicht mehr zu. Deshalb liegt die</text>
<text x="1340.0" y="498.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Leiste mit den Dosen nach oben am Boden,</text>
<text x="1340.0" y="520.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">und die Netzteile stehen in den freien Raum</text>
<text x="1340.0" y="542.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">hinter dem Bildschirm.</text>
<text x="1340.0" y="586.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Befestigen</text>
<text x="1340.0" y="614.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Verteiler mit zwei Holzschrauben 4 × 16 durch</text>
<text x="1340.0" y="636.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">die Laschen in den Boden – nicht länger, der</text>
<text x="1340.0" y="658.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Boden ist 18 mm dick. Den Hub mit zwei</text>
<text x="1340.0" y="680.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">kleinen Winkeln. Nichts lose hineinlegen:</text>
<text x="1340.0" y="702.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Die Box wird transportiert.</text>
<text x="1720.0" y="200.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Löcher</text>
<text x="1720.0" y="228.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Ø 20 im Boden für die M20-Verschraubung,</text>
<text x="1720.0" y="250.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">an jeder Durchführung eine Zugentlastung.</text>
<text x="1720.0" y="272.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Zweimal Ø 22 in der rechten Seitenwand für</text>
<text x="1720.0" y="294.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">die USB-Einbaubuchsen, Mutter von innen.</text>
<text x="1720.0" y="316.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Die beiden Ausschnitte für Leuchte und</text>
<text x="1720.0" y="338.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Drucker sitzen in der Tür.</text>
<text x="1720.0" y="382.0" font-size="19" fill="#241F18" text-anchor="start" font-weight="700">Reihenfolge</text>
<text x="1720.0" y="410.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Erst die Löcher bohren, dann den Verteiler</text>
<text x="1720.0" y="432.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">verschrauben, dann den Hub, zuletzt den Pi</text>
<text x="1720.0" y="454.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">an den Bildschirm. Umgekehrt kommst du mit</text>
<text x="1720.0" y="476.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">dem Akkuschrauber nicht mehr an den Boden.</text>
<text x="1720.0" y="520.0" font-size="19" fill="#C97A16" text-anchor="start" font-weight="700">Nachmessen</text>
<text x="1720.0" y="548.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Die zwei M3-Gewinde sitzen bei jedem Bild-</text>
<text x="1720.0" y="570.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">schirm anders. Miss nach, wo sie liegen, und</text>
<text x="1720.0" y="592.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">setz den Halter danach – alle Maße von ihm</text>
<text x="1720.0" y="614.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">aus hängen daran. Zwischen Halter und Netz-</text>
<text x="1720.0" y="636.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">teil sollen 15 mm Luft bleiben. Bauen deine</text>
<text x="1720.0" y="658.0" font-size="14.5" fill="#6B6255" text-anchor="start" font-weight="400">Netzteile höher, rutscht der Halter hinauf.</text>
<g stroke="#241F18" stroke-width="2" fill="none"><path d="M1340 1000h200.0M1340 992v16M1440.0 995v10M1540.0 992v16"/></g>
<text x="1440.0" y="984.0" font-size="15" fill="#241F18" text-anchor="middle" font-weight="400">100 mm in Wirklichkeit</text>
<text x="1580.0" y="1005.0" font-size="15" fill="#6B6255" text-anchor="start" font-weight="400">Gedruckt auf A3 quer ist das 1 : 2.</text>
</svg>
