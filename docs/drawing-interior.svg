<text x="457.0" y="399.0" font-size="9" text-anchor="middle" fill="#1F2937" font-weight="normal">zum Boden</text>
<text x="600.0" y="150.0" font-size="13" text-anchor="start" fill="#1F2937" font-weight="600">Was wo sitzt</text>
<text x="600.0" y="178.0" font-size="12" text-anchor="start" fill="#1F2937" font-weight="600">screen</text>
<text x="600.0" y="193.0" font-size="11" text-anchor="start" fill="#4B5563" font-weight="normal">liegt von vorn in der Tasche, von hinten verschraubt</text>
