<text x="60.0" y="200.0" font-size="20" fill="#241F18" text-anchor="start" font-weight="700">Wie es läuft</text>
<text x="60.0" y="230.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">Ein Netzkabel geht durch eine M20-Ver-</text>
<text x="60.0" y="251.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">schraubung in die Box. Der Verteiler sitzt</text>
<text x="60.0" y="272.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">unten, verschraubt, und von dort hängt</text>
<text x="60.0" y="293.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">alles ab: die beiden Netzteile, das Kabel</text>
<text x="60.0" y="314.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">nach oben zur Leuchte und das nach unten</text>
<text x="60.0" y="335.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">zum Drucker. Beide gehen durch je einen</text>
<text x="60.0" y="356.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">Ausschnitt in der Tür.</text>
<text x="60.0" y="377.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="60.0" y="398.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">Über dem Streifen liegt nichts mehr über</text>
<text x="60.0" y="419.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">12 Volt.</text>
<text x="60.0" y="440.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="60.0" y="461.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">Bildschirm und Hub hängen mit zwei Kabeln</text>
<text x="60.0" y="482.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">zusammen: eines für den Strom aus dem</text>
<text x="60.0" y="503.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">Ladeanschluss, eines für die Berührung an</text>
<text x="60.0" y="524.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">einem Datenanschluss.</text>
<text x="60.0" y="545.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="60.0" y="566.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">Die Leuchte spricht der Pi über Bluetooth</text>
<text x="60.0" y="587.0" font-size="13.5" fill="#6B6255" text-anchor="start" font-weight="400">an – dorthin geht nur Strom.</text>
</svg>
