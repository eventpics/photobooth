<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" width="304mm" height="202mm" font-family="DejaVu Sans, Verdana, Helvetica, sans-serif">
<rect width="1520" height="1010" fill="#F5F3EE"/>
<text x="760.0" y="74.0" font-size="34" fill="#241F18" text-anchor="middle" font-weight="700">Schmal und hoch – Box 400 mm breit</text>
<text x="760.0" y="112.0" font-size="19" fill="#6B6255" text-anchor="middle" font-weight="400">Die Breite gibt der Bildschirm vor, nicht das Licht · alle Maße in Millimetern</text>
