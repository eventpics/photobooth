hor="middle" font-weight="600">Beleuchtung</text><text x="200.0" y="118.0" font-size="17" fill="#7A4A0C" text-anchor="middle" font-weight="400">300 × 160</text><rect x="185.0" y="194" width="30" height="30" rx="4" fill="#241F18"/><circle cx="200.0" cy="209.0" r="8" fill="#5A6472"/><circle cx="200.0" cy="209.0" r="3.4" fill="#0E1116"/><rect x="35.0" y="238" width="330" height="220" rx="8" fill="#2B2A28" stroke="#241F18" stroke-width="1.6"/><text x="200.0" y="344.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="600">Bildschirm</text><text x="200.0" y="370.0" font-size="16" fill="#CFC9BF" text-anchor="middle" font-weight="400">330 × 220</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M0.0 531.0V545.0M400.0 531.0V545.0M0.0 538.0H400.0"/></g><text x="200.0" y="527.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">400</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M-55.0 0.0H-41.0M-55.0 480.0H-41.0M-48.0 0.0V480.0"/></g><text x="-59.0" y="240.0" font-size="15" fill="#6B6255" text-anchor="middle" transform="rotate(-90 -59.0 240.0)">480</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M50.0 -19.0V-5.0M350.0 -19.0V-5.0M50.0 -12.0H350.0"/></g><text x="200.0" y="-23.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">300</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M441.0 20.0H455.0M441.0 180.0H455.0M448.0 20.0V180.0"/></g><text x="437.0" y="100.0" font-size="15" fill="#6B6255" text-anchor="middle" transform="rotate(-90 437.0 100.0)">160</text><path d="M0 35A35 35 0 0 1 35 0" stroke="#C97A16" stroke-width="3" fill="none" stroke-dasharray="5 5"/><text x="57.0" y="19.0" font-size="14" fill="#C97A16" text-anchor="start" font-weight="400">R 35</text><text x="200.0" y="592.0" font-size="18" fill="#241F18" text-anchor="middle" font-weight="600">20 × 300 mm = 6,00 m · 480 cm²</text><text x="200.0" y="618.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">Geht exakt auf, kein Rest</text><text x="200.0" y="644.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">Box 400 × 480 · Rand neben dem Bildschirm je 35</text></g>
<g transform="translate(620 210)"><text x="200.0" y="-40.0" font-size="24" fill="#241F18" text-anchor="middle" font-weight="700">Alternative: 350 × 136</text><rect x="0" y="0" width="400" height="456" rx="35" ry="35" fill="#FFFFFF" stroke="#241F18" stroke-width="4"/><path d="M200.0 -14V470" stroke="#C9C1B2" stroke-width="1" stroke-dasharray="14 8 3 8"/><rect x="25.0" y="20" width="350" height="136" rx="4" fill="#F0C77A" stroke="#C97A16" stroke-width="1.6"/><path d="M25.0 28H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 36H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 44H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 52H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 60H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 68H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 76H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 84H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 92H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 100H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 108H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 116H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 124H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 132H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 140H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><path d="M25.0 148H375.0" stroke="#C97A16" stroke-width="0.5" opacity="0.55"/><text x="200.0" y="82.0" font-size="18" fill="#7A4A0C" text-anchor="middle" font-weight="600">Beleuchtung</text><text x="200.0" y="106.0" font-size="17" fill="#7A4A0C" text-anchor="middle" font-weight="400">350 × 136</text><rect x="185.0" y="170" width="30" height="30" rx="4" fill="#241F18"/><circle cx="200.0" cy="185.0" r="8" fill="#5A6472"/><circle cx="200.0" cy="185.0" r="3.4" fill="#0E1116"/><rect x="35.0" y="214" width="330" height="220" rx="8" fill="#2B2A28" stroke="#241F18" stroke-width="1.6"/><text x="200.0" y="320.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="600">Bildschirm</text><text x="200.0" y="346.0" font-size="16" fill="#CFC9BF" text-anchor="middle" font-weight="400">330 × 220</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M0.0 507.0V521.0M400.0 507.0V521.0M0.0 514.0H400.0"/></g><text x="200.0" y="503.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">400</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M-55.0 0.0H-41.0M-55.0 456.0H-41.0M-48.0 0.0V456.0"/></g><text x="-59.0" y="228.0" font-size="15" fill="#6B6255" text-anchor="middle" transform="rotate(-90 -59.0 228.0)">456</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M25.0 -19.0V-5.0M375.0 -19.0V-5.0M25.0 -12.0H375.0"/></g><text x="200.0" y="-23.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">350</text><g stroke="#6B6255" stroke-width="1.2" fill="none"><path d="M441.0 20.0H455.0M441.0 156.0H455.0M448.0 20.0V156.0"/></g><text x="437.0" y="88.0" font-size="15" fill="#6B6255" text-anchor="middle" transform="rotate(-90 437.0 88.0)">136</text><path d="M0 35A35 35 0 0 1 35 0" stroke="#C97A16" stroke-width="3" fill="none" stroke-dasharray="5 5"/><text x="57.0" y="19.0" font-size="14" fill="#C97A16" text-anchor="start" font-weight="400">R 35</text><text x="200.0" y="568.0" font-size="18" fill="#241F18" text-anchor="middle" font-weight="600">17 × 350 mm = 5,95 m · 476 cm²</text><text x="200.0" y="594.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">5 cm Rest, dafür 24 mm niedrigere Box</text><text x="200.0" y="620.0" font-size="15" fill="#6B6255" text-anchor="middle" font-weight="400">Breiteres Licht, besser für Gruppen · Rand je 35</text></g>
<text x="1120.0" y="215.0" font-size="20" fill="#241F18" text-anchor="start" font-weight="700">Beim Paket ein Gewinn</text>
<text x="1120.0" y="245.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">Karton = Box + 126 mm je Richtung</text>
<text x="1120.0" y="268.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="1120.0" y="291.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">400 × 480 × 250</text>
<text x="1120.0" y="314.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">→ 526 × 606 × 376</text>
<text x="1120.0" y="337.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="1120.0" y="360.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">Die Post erlaubt 1000 × 600 × 600:</text>
<text x="1120.0" y="383.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">eine Kante darf lang sein, zwei</text>
<text x="1120.0" y="406.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">müssen unter 600 bleiben.</text>
<text x="1120.0" y="429.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="1120.0" y="452.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">Hier ist 606 die lange Kante,</text>
<text x="1120.0" y="475.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">526 und 376 liegen darunter –</text>
<text x="1120.0" y="498.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">mit 74 mm Reserve statt 24 mm</text>
<text x="1120.0" y="521.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">wie beim Quadrat 450 × 450.</text>
<text x="1120.0" y="544.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400"></text>
<text x="1120.0" y="567.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">Hoch und schmal ist also die</text>
<text x="1120.0" y="590.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">versandfreundlichste Form.</text>
<text x="1120.0" y="685.0" font-size="20" fill="#241F18" text-anchor="start" font-weight="700">Vorher messen</text>
<text x="1120.0" y="715.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">330 × 220 ist die sichtbare Fläche.</text>
<text x="1120.0" y="738.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">Das Bildschirmgehäuse ist breiter –</text>
<text x="1120.0" y="761.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">beim 15,3-Zoll-Modell rund 355 mm.</text>
<text x="1120.0" y="784.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">In 400 mm Box bleiben dann 22 mm</text>
<text x="1120.0" y="807.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">je Seite für die Wand. Miss dein</text>
<text x="1120.0" y="830.0" font-size="15.5" fill="#6B6255" text-anchor="start" font-weight="400">Gehäuse, bevor du 400 festlegst.</text>
<g stroke="#241F18" stroke-width="2" fill="none"><path d="M120 960h100M120 952v16M170 955v10M220 952v16"/></g>
<text x="170.0" y="944.0" font-size="16" fill="#241F18" text-anchor="middle" font-weight="400">100 mm in Wirklichkeit</text>
</svg>
