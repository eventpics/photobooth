# Protokoll dauerhaft auf der Speicherkarte behalten.
#
# Raspberry Pi OS haelt das Systemprotokoll voreingestellt nur im
# Arbeitsspeicher. Stuerzt die Box ab oder wird hart ausgeschaltet, ist damit
# genau das Protokoll weg, das erklaeren wuerde, warum. Auf 50 MB begrenzt,
# damit die Karte nicht vollschreibt.
[Journal]
Storage=persistent
SystemMaxUse=50M
